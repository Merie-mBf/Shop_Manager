<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body>

    <header id="header" class="flex items-center justify-between bg-[#70452F] rounded-b-2xl px-6 py-4">
        <div class="logo flex items-center justify-between gap-2">
            <i class="fa-brands fa-shopify text-2xl text-[#F5F0E8]"></i>
            <h1 class="text-xl font-bold text-[#F5F0E8]">Shop Manager</h1>
        </div>
        <div class="navigation">
            <nav class="flex items-center gap-4">
                <a href="#products"
                    class="border border-[#F5F0E8] text-[#F5F0E8] font-bold px-5 py-2.5 rounded-lg  transition-all duration-300">
                    Products</a>
                <a href="#cart-slide-over" id="GoToCart"
                    class="border border-[#70452F] bg-[#F5F0E8] text-[#70452F] font-bold px-5 py-2.5 rounded-lg  transition-all duration-300">
                    Carts</a>
            </nav>
        </div>
    </header>

    <main class="bg-[#F5F0E8] pt-1">

        <section id="search" class="mx-8 mt-12 rounded-3xl bg-[#E8D5C2] p-10 md:p-16">
            <div class="text">
                <small class="text-sm font-bold uppercase tracking-widest text-[#70452F]">Curated essentials</small>
                <h2 class="mt-4 text-4xl font-bold text-[#4b3023]">Discover Our Collection</h2>
                <p class="mt-4 text-lg text-[#80634F]">Find the perfect products for your everyday needs.</p>
            </div>
            <div class="mt-10">
                <form class="form">
                    <input type="search" id="searchInput" placeholder="Search products..."
                        class="w-full rounded-xl border border-[#D8C2AE] bg-white px-5 py-4 text-[#70452F] focus:border-[#70452F] focus:outline-none">
                </form>
            </div>
        </section>

        <section id="filter" class="mx-8 mt-12 rounded-3xl border border-[#E8D5C2] bg-white p-6 md:p-8">
            <div>
                <form class="form flex flex-wrap items-end justify-between gap-6">
                    <div class="categories flex flex-col gap-3">
                        <label for="category" class="text-[#70452F] font-medium">CATEGORY</label>
                        <select id="category" name="category" required class="rounded-xl border border-[#D8C2AE]
                         px-5 py-4 w-full text-[#70452F] focus:border-[#70452F] focus:outline-none">
                            <!--  <option value="">All categories</option> -->
                            <!-- <option value="">Books</option>
                            <option value="">Electronics</option>
                            <option value="">mobile</option> -->
                        </select>
                    </div>
                    <div class="maxPrice flex flex-col  gap-3">
                        <label for="maxPrice" class="text-[#70452F] font-medium">MAXIMUM PRICE</label>
                        <input type="number" min="0" id="maxPrice" name="maxPrice" placeholder="any price"
                            class="rounded-xl border border-[#D8C2AE] px-5 py-4 w-full text-[#70452F] focus:border-[#70452F] focus:outline-none">
                    </div>
                    <div>
                        <label
                            class="flex items-center gap-3 rounded-xl border border-[#D8C2AE] px-5 py-4 w-full text-[#70452F]">
                            <input type="checkbox" id="inStock"> In stock only</label>
                    </div>
                </form>
            </div>
        </section>

        <section id="products" class="flex flex-wrap  gap-6 p-10 ">
            <div class="w-full mb-2">
                <h3 class="text-3xl font-bold text-[#70452F] mb-2">Products</h3>
                <small class="text-base text-[#70452F]">Showing 100 of 100 products</small>
            </div>
        </section>

        <section id="resert" class="w-full my-8">
            <button type="button" id="btnReset"
                class="block mx-auto bg-[#70452F] text-[#F5F0E8] px-8 py-3 rounded-xl font-semibold hover:bg-[#5a3829] transition duration-300 shadow-sm">
                <i class="fa-solid fa-rotate-left mr-2"></i>
                Reset Filters
            </button>
        </section>

        <section id="dialog">
            <dialog id="cart"
                class="m-0 ml-auto h-screen max-h-screen w-[550px] max-w-full p-0 shadow-xl backdrop:bg-black/40 open:flex flex-col">

                <div class="flex justify-between items-center p-6 pb-0 mb-8 shrink-0">
                    <h2 class="flex items-center gap-3 font-bold text-[#4b3023] text-xl">
                        <i class="fa-solid fa-cart-shopping"></i> My Cart
                    </h2>
                    <button id="closeCart"
                        class="w-9 h-9 rounded-full bg-[#f0e5d9] text-[#4b3023] transition flex items-center justify-center hover:bg-[#4b3023] hover:text-[#f0e5d9]">
                        <i class="fa-solid fa-x"></i>
                    </button>
                </div>

                <div id="ListCartProducts" class="flex-1 overflow-y-auto overscroll-contain min-h-0 px-6"></div>

                <div class="border-t border-[#eee2d7] p-6 ">
                    <p class="text-[#382719]">Articles: <span id="cartCount">0</span></p>
                    <p class="font-bold text-[#382719]">Total: <span id="cartTotal">0</span> DH</p>
                    <div class="mt-3 flex items-center gap-3">
                        <button id="clearCart" type="button"
                            class="group flex-1 h-9 bg-[#4b3023] text-[#f0e5d9] text-sm font-medium rounded-lg transition-colors cursor-pointer">
                            <span class="inline-block transition-transform duration-200 group-hover:scale-110">
                                Empty the cart
                            </span>
                        </button>

                        <button id="reserveCart" type="button"
                            class="group flex-1 h-9 bg-[#f0e5d9] text-[#4b3023] text-sm font-medium rounded-lg transition-colors cursor-pointer">
                            <span class="inline-block transition-transform duration-200 group-hover:scale-110">
                                Reserver
                            </span>
                        </button>
                    </div>
                </div>
            </dialog>
        </section>


        <section id="FormClient">
            <dialog id="Form"
                class="m-0 ml-auto h-screen max-h-screen w-[550px] max-w-full p-0 shadow-xl backdrop:bg-black/40">
                <div class="flex justify-between items-center p-5 border-b border-[#eee2d7]">
                    <h2 class="font-bold text-[#4b3023] text-xl">Reservation form</h2>
                    <button id="closeForm" type="button"
                        class="w-9 h-9 rounded-full bg-[#f0e5d9] text-[#4b3023] flex items-center justify-center hover:bg-[#4b3023] hover:text-white transition">
                        <i class="fa-solid fa-x"></i>
                    </button>
                </div>
                <form id="FormContent" class="p-6 space-y-5 overflow-y-auto">
                    <div>
                        <label for="Name" class="block text-sm font-medium text-[#4b3023] mb-2"> Name </label>
                        <input type="text" id="Name" name="name" required placeholder="Enter your name"
                            class="w-full h-11 px-4 border border-[#e8d5c4] rounded-lg outline-none focus:border-[#4b3023]">
                    </div>
                    <div>
                        <label for="Email" class="block text-sm font-medium text-[#4b3023] mb-2">Email Address </label>
                        <input type="email" id="Email" name="email" required placeholder="example123@email.com"
                            class="w-full h-11 px-4 border border-[#e8d5c4] rounded-lg outline-none focus:border-[#4b3023]">
                    </div>
                    <div>
                        <label for="Address" class="block text-sm font-medium text-[#4b3023] mb-2"> Address </label>
                        <input type="text" id="Address" name="address" required placeholder="Enter your address"
                            class="w-full h-11 px-4 border border-[#e8d5c4] rounded-lg outline-none focus:border-[#4b3023]">
                    </div>

                    <div>
                        <label for="City" class="block text-sm font-medium text-[#4b3023] mb-2">City</label>
                        <input type="text" id="City" name="city" required placeholder="Enter your city"
                            class="w-full h-11 px-4 border border-[#e8d5c4] rounded-lg outline-none focus:border-[#4b3023]">
                    </div>
                    <div>
                        <label for="Phone" class="block text-sm font-medium text-[#4b3023] mb-2"> Phone Number </label>
                        <input type="tel" id="Phone" name="phone" placeholder="Enter your phone number"
                            class="w-full h-11 px-4 border border-[#e8d5c4] rounded-lg outline-none focus:border-[#4b3023]">
                    </div>
                    <div>
                        <label for="PostalCode" class="block text-sm font-medium text-[#4b3023] mb-2">Postal Code </label>
                        <input type="text" id="PostalCode" name="postalCode" placeholder="Enter your postal code"
                            class="w-full h-11 px-4 border border-[#e8d5c4] rounded-lg outline-none focus:border-[#4b3023]">
                    </div>
                    <div>
                        <label for="Note" class="block text-sm font-medium text-[#4b3023] mb-2">Note</label>
                        <textarea id="Note" name="note" rows="3" placeholder="Add a note "
                            class="w-full p-4 border border-[#e8d5c4] rounded-lg outline-none focus:border-[#4b3023] resize-none"></textarea>
                    </div>
                    <button type="submit"
                        class="w-full h-11 bg-[#4b3023] text-[#f0e5d9] font-medium rounded-lg hover:bg-[#382719] transition">
                        Confirm Reservation
                    </button>
                </form>
            </dialog>
        </section>

    </main>

    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="script.js"></script>
</body>

</html>
